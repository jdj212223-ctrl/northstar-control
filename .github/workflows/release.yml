name: Build and publish desktop release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to build and publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    name: Package ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            os: macos-latest
            args: --target universal-apple-darwin --bundles app,dmg
            targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: Windows
            os: windows-latest
            args: --bundles nsis
            targets: ""
          - platform: Linux-x64
            os: ubuntu-22.04
            args: --bundles deb,rpm,appimage
            targets: ""
          - platform: Linux-arm64
            os: ubuntu-22.04-arm
            args: --bundles deb,rpm,appimage
            targets: ""
    steps:
      - name: Check out release
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag && github.sha || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1

      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          node -e 'if (`v${require("./package.json").version}` !== process.env.RELEASE_TAG) throw new Error("Release tag must match package.json version")'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'Linux')
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev libssl-dev rpm file

      - name: Check web source syntax
        run: node --check app/app.js && node --check app/bench.js && node --check app/tauri-bridge.js

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Generate icons
        run: cargo tauri icon assets/northstar.png

      - name: Test Rust modules
        working-directory: src-tauri
        run: cargo test --lib

      - name: Build installers
        run: cargo tauri build ${{ matrix.args }}

      - name: Collect installers
        shell: bash
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          mkdir out
          B=src-tauri/target
          if [ "${{ matrix.platform }}" = "macOS" ]; then
            APP=$(find $B -type d -name "*.app" -path "*bundle/macos*" | head -n1)
            ditto -c -k --keepParent "$APP" "out/Northstar-Control-$VERSION-universal-mac.zip"
            cp $(find $B -name "*.dmg" | head -n1) "out/Northstar-Control-$VERSION-universal.dmg"
          elif [ "${{ matrix.platform }}" = "Windows" ]; then
            cp $(find $B -name "*-setup.exe" | head -n1) "out/Northstar.Control.Setup.$VERSION.exe"
          else
            ARCH=$([ "${{ matrix.platform }}" = "Linux-arm64" ] && echo arm64 || echo x86_64)
            cp $(find $B -name "*.AppImage" | head -n1) "out/Northstar.Control-$VERSION-$ARCH.AppImage"
            cp $(find $B -name "*.deb" | head -n1) "out/Northstar.Control-$VERSION-$ARCH.deb"
            cp $(find $B -name "*.rpm" | head -n1) "out/Northstar.Control-$VERSION-$ARCH.rpm"
          fi
          ls -l out

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}
          path: out/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs:
      - package
    runs-on: ubuntu-latest
    steps:
      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" installers/* \
              --repo "$GH_REPO" \
              --clobber
          else
            gh release create "$RELEASE_TAG" installers/* \
              --repo "$GH_REPO" \
              --title "Northstar Control $RELEASE_TAG" \
              --generate-notes
          fi
